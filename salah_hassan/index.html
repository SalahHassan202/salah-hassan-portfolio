<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salah Hassan — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    /* Theme Tokens */
    :root {
      --transition: .35s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      --radius-card: 28px;
    }
    [data-theme="dark"] {
      --bg: #07090f;
      --bg2: #0c101a;
      --text: #dde8f4;
      --text2: #7a9ab8;
      --accent: #00d4ff;
      --accent2: #00ff94;
      --border: rgba(0,212,255,0.18);
      --border2: rgba(255,255,255,0.07);
    }
    [data-theme="light"] {
      --bg: #f4f7fb;
      --bg2: #eaf0f8;
      --text: #0d1b2e;
      --text2: #4a6280;
      --accent: #0284c7;
      --accent2: #059669;
      --border: rgba(2,100,200,0.18);
      --border2: rgba(0,0,0,0.07);
    }

    /* Base */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html {
      scroll-behavior: smooth;
      scroll-padding-top: 76px;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      overflow-x: hidden;
      transition: background var(--transition), color var(--transition);
    }
    ::selection {
      background: var(--accent);
      color: #000;
    }

    /* Grid Background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image: linear-gradient(rgba(0,212,255,0.035) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(0,212,255,0.035) 1px, transparent 1px);
      background-size: 56px 56px;
    }
    [data-theme="light"] body::before {
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <h1 style="text-align: center; padding: 50px;">Portfolio Loading...</h1>
</body>
</html>

<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salah Hassan — Portfolio</title>
  <style>
    /* Theme Tokens */
    :root {
      --transition: .35s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    }
    [data-theme="dark"] {
      --bg: #07090f;
      --text: #dde8f4;
      --accent: #00d4ff;
      --accent2: #00ff94;
    }
    [data-theme="light"] {
      --bg: #f4f7fb;
      --text: #0d1b2e;
      --accent: #0284c7;
      --accent2: #059669;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: var(--bg);
      color: var(--text);
      transition: background var(--transition), color var(--transition);
      font-family: system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <h1>Portfolio Loading...</h1>
</body>
</html>
